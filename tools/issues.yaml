- key: f3
  parent: epic
  title: "[Feature] F3 Glide joint, print internals, mass properties and report"
  labels: [type:feature, area:geometry, area:physics]
  body: |
    ## Goal
    Turn the envelope into a two-section glide bait with print internals, and measure it.

    ## Design notes
    - **Joint:** V-joint at `joint_frac` (0.50), gap 2.3 mm, arms 35–40°, vertical pin just behind the joint, hinge eyes at Z −12/+6, line tie at Z −4. Booleans run on the full body before the split.
    - **Print internals:**
      - The cavity is an **explicit inset loft** through the mid stations only.
      - Gable or teardrop roof, so the ceiling is self-supporting when printed on its side.
      - Solid keel below `keel_top_z`.
      - Main ballast pocket ~22 mm ahead of the joint, ~6 mm above the belly.
      - Aft tail trim pocket.
      - Solid bosses for screw eyes.
    - **Validity:** each section is 1 solid with 2 shells (one sealed void), asserted after every boolean.
    - **Mass properties:**
      - Per section: Σ ρᵢVᵢ over the body solid and ballast, plus hardware point masses.
      - CB is the centroid of the displaced envelope volume.
      - Hardware volume counts as displacement.
    - **Report:** per-section and whole-lure mass (g and oz), densities, fore/aft CG−CB, vertical CB−CG, head:tail ratio, verdict, and a CG/CB diagram PNG.

    ## Tasks (to be created as sub-issues when this feature starts)
    - [ ] V-joint split, pin bore, hinge eye and line tie geometry
    - [ ] Inset-loft cavity with gable roof plus solid keel
    - [ ] Ballast and trim pockets plus screw bosses
    - [ ] Mass properties module (per solid, per section, point masses)
    - [ ] report.json/md with a CG/CB diagram

    ## Done when
    - [ ] The sample variant builds two sections, each with exactly one sealed void
    - [ ] The report shows all derived values

- key: f4
  parent: epic
  title: "[Feature] F4 Buoyancy model and balance solver"
  labels: [type:feature, area:physics]
  body: |
    ## Goal
    Solve the internals so each section, and the whole lure, meets the balance targets across the hardware tolerance band.

    ## Design notes
    - **Target overall density** in salt water (1.025): float 0.90–0.98, suspend 1.020–1.030, slow sink 1.03–1.06. These are starting values; F8 calibrates them.
    - **Totals:** m_total = Σρᵢvᵢ + Σm_hw and V_total = V_env + Σ m_hw/ρ_hw (submerged hooks displace too).
    - **Hardware band:** solve at the midpoint and evaluate both ends. Fail if either end leaves the sink mode or breaks level hang. Size the trim pocket for the band, and report "add/remove X g of tungsten putty".
    - **Solver:** finite-difference Jacobian plus a clamped least-squares step. Stop at ≤5 passes or convergence, and report residuals.
      - Print knobs: `wall_thk`, `keel_top_z`, ballast g and x, width trims, `section_drop_rise`.
      - CNC knobs: pocket depths, ballast g and x, width trim.
    - **Weight → length:** if `target_weight_oz` is set, L = L₀·(m/ρ_t·V₀)^(1/3), rebuild once, then solve the internals.
    - The ballast mass can be pinned with `ballast.mass_g`.

    ## Tasks (to be created when this feature starts)
    - [ ] Buoyancy targets and hardware band evaluation
    - [ ] Jacobian solver with knob registry per process
    - [ ] Weight→length scaling
    - [ ] Solver convergence tests on the reference targets

    ## Done when
    - [ ] The sample converges in ≤5 passes with |CG−CB| ≤ 1 mm at both band ends
    - [ ] Reproduces the reference-bait numbers within tolerance

