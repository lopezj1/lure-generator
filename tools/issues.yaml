    - edit configs and specs
    - upload photos, CSVs and reference G-code
    - view the 3D model with cross-sections on a selectable plane
    - preview print G-code (OrcaSlicer/Fluidd/Mainsail-style) and CNC toolpaths (gSender-style)
    - run jobs and export STL/STEP/3MF/G-code/NC

    It runs on the home server as one container.

    ## Architecture
    ```
    Browser: Svelte 5 SPA (static) ── JSON + binary, same origin ── FastAPI (`lure serve`, in luregen)
      config editor (schema-driven)          reads: spec, schema, validate, sections, G-code→binary
      model viewer (three-cad-viewer)        writes: variant TOML via tomlkit diff (comments kept)
      print / CNC previews (own three.js)    jobs: queue → `python -m luregen <cmd> --progress json` subprocesses
      jobs, builds, exports                  → existing CLI (profile / build / fab) → builds/
    ```

    ## Stack
    | Layer | Choice |
    |---|---|
    | Frontend | Vite 8 + Svelte 5 + TypeScript, plain SPA (no SvelteKit), Pico CSS |
    | Forms | @sjsf/form (Svelte 5 JSON-Schema forms) + custom widgets (range slider, [min,max] pair, material select) |
    | 3D model | three-cad-viewer 5.x + server-side ocp-tessellate; `three` pinned to the viewer's version (0.184) and deduped |
    | Sections | trimesh section by default; exact build123d `section()` on demand (guarded subprocess) |
    | G-code viewers | our own three.js renderers fed compact binary from the existing Python G-code interpreter |
    | API | FastAPI with built-in SSE, uvicorn, tomlkit, python-multipart (`web` dependency group) |
    | Types | OpenAPI → openapi-typescript; `openapi.json` committed |
    | Jobs | in-process asyncio queue running `lure` subprocesses (crash-isolated); `@@progress` / `@@result` lines → SSE |
    | Deploy | single Ubuntu 24.04 image (Python + OCP + extracted OrcaSlicer + xvfb + API + built SPA); one compose service; **dev stays native** |

    ## Decisions
    1. **The backend owns all logic.** The browser only edits and displays: no TOML or G-code parsing in JS, and one parser (Python) feeds both viewers.
    2. **Every UI action maps to a CLI command**, so it's reproducible from the terminal.
    3. **UI edits write directly to the git-tracked `spec/`**: diff-only, comments preserved, mtime conflict check, `.bak`. The UI shows a "spec has uncommitted changes" badge; commits stay manual.
    4. **LAN only, no auth.** Uploads are content-checked and size-capped. Every path is checked to stay inside the data root.
    5. **Develop natively; deploy one image** (no Docker socket, no multi-service split). In the image the slicer runs directly, so the glibc 2.38 need is met.
    6. Viewers are built against existing fixtures (Orca test-cube slice, multi-material reference #26, golden `.nc`, Fusion excerpt), so they don't wait on F6b/F7b.
    7. Design ideas come from OrcaSlicer, Fluidd, Mainsail, OctoPrint and gSender. **Reimplemented, no code copied.**

    ## Roadmap
    - W0 first, solo (pins all new Python and npm deps)
    - Wave A in parallel: W1, W2, W3, W8
    - Wave B in parallel: W4, W5, W6, W7, W9

    ## Risks / spikes
    - sjsf rendering of pydantic Optionals and tuples. Fix: a server-side schema post-pass (spike in W0).
    - ocp-tessellate ↔ build123d 0.13 / OCCT 8 ↔ three-cad-viewer compatibility (spike in W0). Fallback: GLB + own three.js clipping.
    - Stencil caps need watertight solids (F2 already checks).
    - Large print files (e.g. 617k lines / 160 tool changes): binary arrays, draw ranges, render on demand.

    Related: pipeline epic #1.

