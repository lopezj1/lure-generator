- key: f7
  parent: epic
  title: "[Feature] F7 CNC fab: Shapeoko 3 XXL (CAM + Carbide Motion post)"
  labels: [type:feature, area:cnc]
  body: |
    ## Goal
    `lure fab <build> --format cnc` produces a two-setup (glue face, flip, outer face) G-code set, a setup sheet and a cut simulation for the Shapeoko 3 XXL on Carbide Motion.

    ## Design notes
    - **CNC internals:**
      - Halves split on the centerplane.
      - Glue-face ballast and air pockets (flat bottom, corner radius ≥ tool radius).
      - Ball-nose half-groove for a through-wire.
      - Dowel and registration-pin holes in the waste area.
    - **CAM (custom; no pip CAM library is maintained):**
      - 2.5D: shapely `buffer` offsets for facing, pockets, profile with 4–6 tabs, and peck drilling.
      - 3D (loft3d only): a trimesh heightmap (~0.15 mm) with a ball-kernel `grey_dilation` to get the tool-tip surface. Rough with z-level contours, leaving 0.5 mm; finish with a raster along the body.
      - Stepover s = √(8Rh). A 1/8" ball at 0.05 mm scallop gives ~0.8 mm.
    - **Flip workflow:** setup 1 cuts the glue face. Then flip about X on pins, mirror Y, and keep the same XY zero. Setup 2 cuts the outer face.
    - **Carbide Motion rules:**
      - Supported: G0–G4, G17–19, G20/21, G28, G90/91, M0–M2, M30, M3, M5, **M6**.
      - **Rejected:** G80–G83 and G43 Hn. Expand drilling into pecks.
      - **Ignored:** G54–59. Never emit G10 or G92.
      - `M6 Tn` triggers the tool-change prompt and a BitSetter measurement.
      - Post in mm.
    - **Post ideas** (reimplemented from public references; no code copied):
      - Template schema modeled on PureCutCNC's `grbl.json`.
      - Shapeoko XXL defaults from Kiri:Moto's device profile.
      - **Arc endpoint snapping:** round the start and center to output precision, then recompute the end so it lies on the circle (avoids GRBL error 33).
      - Arc limits: linearize when the chord is < 0.25 mm or the radius < 0.1 mm, max 180° per arc.
      - Comments sanitized and ≤ 80 characters.
      - Retract and park with `G53 G0 Z`, and a spin-up dwell.
    - **Draft `post.toml`:**
      ```toml
      units = "mm"; decimals = { xyz = 3, feed = 0, rpm = 0, dwell = 2 }; word_separator = ""
      header = ["(Design: {variant} {setup})", "(stockMin:{stock_min})", "(stockMax:{stock_max})", "G90", "G21", "G17", "G94"]
      safe_retract = "G53 G0 Z-5"; footer = ["M5", "G53 G0 Z-5", "G53 G0 X-5 Y-5", "M30"]
      forbid = ["G10","G92","G41","G42","G43","G80","G81","G82","G83","M4","M8"]
      tool_change = ["M5", "G53 G0 Z-5", "(TOOL/MILL,{dia},{corner_r},0,0)", "M6 T{carbide_no}"]
      spindle = { type = "router_dial", on = "M3 S{rpm}", dwell_s = 3 }
      arcs = { enabled = true, format = "ij", max_sweep_deg = 180, min_radius = 0.1, min_chord = 0.25, snap_endpoint = true }
      drill = "expand"
      ```
    - **Verify:** bounds vs stock and travel, no G0 below safe Z, spindle on before cutting, no forbidden codes, lines < 80 characters, and a heightmap cut simulation diffed against the target (gouge and leftover PNG).

    ## Tasks (to be created when this feature starts)
    - [ ] CNC internals: halves, pockets, wire groove, dowels
    - [ ] Setup planner and flip transform
    - [ ] 2.5D ops (face, pocket, profile and tabs, peck drill, groove)
    - [ ] 3D heightmap roughing and finishing
    - [ ] Post-processor plus golden tests
    - [ ] `analyze-gcode` reference analyzer that proposes post.toml values
    - [ ] Verifier and cut simulation
    - [ ] Setup sheet (stock, zero, tools per setup, flip, ballast/wire before glue-up)

    ## Done when
    - [ ] Golden tests match the reference style; an air-cut runs clean on the machine; the halves register after the flip

