- key: w1
  parent: wepic
  title: "[Feature] W1 API core: spec, variants, schema, validate, save, uploads, builds"
  labels: [type:feature, area:api]
  body: |
    ## Endpoints (under `/api`)
    | Method | Path | Notes |
    |---|---|---|
    | GET | `/designs`, `/designs/{family}/variants`, `/machines`, `/materials` | scan `spec/` |
    | GET | `/variants/{family}/{name}` | `{layered, resolved, own, parents}`, with inherited vs overridden per key |
    | GET | `/schema/lure-config` | post-processed JSON Schema (from the W0 spike) |
    | POST | `/variants/{family}/{name}/validate` | dry-run `load_config` → errors |
    | PUT | `/variants/{family}/{name}` | validate, then a **tomlkit diff writer**; 409 on mtime change |
    | POST | `/uploads?kind=photo\|csv\|gcode` | 25 MB cap, content-checked, stored at `uploads/<sha256>.<ext>` |
    | GET | `/builds`, `/builds/{path}/files/{file}` | report summaries; paths confined to `builds/` |
    | GET | `/spec/status` | git dirty state for the UI badge |

    ## Diff writer rules
    1. Merge the parent chain with `load_layered`.
    2. Recursively diff the edited config against the parents. Lists (incl. `[[hardware]]`) compare whole.
    3. In the variant's tomlkit document, set changed keys in place, add new keys at the end of their table, and delete keys now equal to the inherited value.
    4. Never touch `extends` or `name`. Keep path keys relative.
    5. Re-validate, then write atomically with a `.bak`.

    ## Done when
    - [ ] Endpoint tests, including the diff writer keeping comments on the sample variant and path-containment tests
    ## Depends on
    {{w0}}

- key: w2
  parent: wepic
  title: "[Feature] W2 Job runner with live progress (SSE)"
  labels: [type:feature, area:api]
  body: |
    ## Design
    - `POST /jobs {op: profile|build|fab_print|fab_cnc, args, overrides[]}` → 202 `{id}`
    - One asyncio worker runs `python -m luregen <cmd> --progress json` with `start_new_session=True`, so crashes are isolated.
    - The log goes to `builds/.jobs/<id>.log` and state to `<id>.json`; jobs still running at startup are marked `interrupted`.
    - `GET /jobs/{id}/events` streams SSE `log`, `progress` and `status` events with ids, so the client can resume.
    - `DELETE /jobs/{id}` sends SIGTERM to the process group.
    - `@@result {"build_dir": …}` links the job to its build.
    ## Done when
    - [ ] Tests: success, failure, simulated segfault, cancel, restart recovery, and SSE resume
    ## Depends on
    {{w0}}

- key: w3
  parent: wepic
  title: "[Feature] W3 G-code → compact binary for the viewers (print + CNC)"
  labels: [type:feature, area:api]
  body: |
    ## Design
    Reuse the Python G-code tokenizer/interpreter (F7a `luregen/fab/gcode.py`).
    - **Print** (Orca): adds an extrusion-state pass (extrude vs travel). Layer comes from `;LAYER_CHANGE` / `;Z:`, feature from `;TYPE:`, tool from `T<n>`, plus width/height/feed, with flags for the pause (M600) and tool-change points.
    - **CNC:** arcs tessellated in their own plane (G17/G18/G19) at chord tolerance ~0.02 mm. Move kind is rapid/feed/plunge; tool comes from `M6T`/`T`.
    - **Output format:**
      - a small JSON header: bounds, per-layer offsets, tool table, feature table, markers
      - typed arrays: Float32 xyz endpoints, Uint8 kind/feature/tool, Uint16 layer, Float32 feed/width
      - served brotli/gzip as `GET /builds/{path}/toolpath/{file}.bin` and cached as `<file>.bin` by mtime
    ## Done when
    - [ ] Fixtures encode correctly: Orca cube, the multi-material reference excerpt (#26), golden `.nc` files, the Fusion excerpt with G18/G19 arcs
    - [ ] The 617k-line reference encodes in reasonable time and size (target < 10 s, < 10 MB compressed)
    ## Depends on
    {{w0}}; the F6a/F7a modules (#49, #48)

