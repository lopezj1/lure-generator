- key: f5
  parent: epic
  title: "[Feature] F5 DFM rule engine"
  labels: [type:feature, area:dfm]
  body: |
    ## Goal
    A rule registry: `rule(model, cfg) -> list[Violation]`, tagged by process, body_style and family. Errors fail the build; warnings go in the report.

    ## Rules
    | Rule | print | cnc |
    |---|---|---|
    | Exactly one sealed void per section | error | — |
    | No internal voids | — | error |
    | Min wall / skin-to-cavity | ≥1.6 / 1.2 mm | ≥3.5 mm |
    | Cavity ceiling ≤45° overhang (printed on its side) | error | — |
    | Inside corner radius ≥ tool radius + 0.1 (incl. the V-joint apex) | — | error |
    | Pocket depth ≤ 3 × tool diameter | — | error |
    | No undercuts from each machining side | — | error |
    | No axial holes (use a half-groove) | — | error |
    | Roundover ≤ `max_fillet()` and ≤ min outline curvature radius | — | error |
    | Screw eyes only into solid bosses | error | — |
    | Through-wire recommended for wood | — | warn |

    ## Tasks (to be created when this feature starts)
    - [ ] Registry, Violation model, report integration
    - [ ] Print rules
    - [ ] CNC rules
    - [ ] One failing-case fixture per rule

    ## Done when
    - [ ] Every rule has a failing-case test; the sample variant passes for both processes

- key: f6
  parent: epic
  title: "[Feature] F6 Print fab: Snapmaker U1 via OrcaSlicer CLI"
  labels: [type:feature, area:print]
  body: |
    ## Goal
    `lure fab <build> --format print` produces sliced G-code for the U1, with a ballast-insert pause, verified against a reference print.

    ## Design notes
    - **Primary slicer: upstream OrcaSlicer 2.5.1** (`orca-slicer` AppImage). Its CLI resolves `inherits` itself. **Fallback: Snapmaker Orca 2.4.1**, whose CLI doesn't resolve `inherits` and crashes on `wipe_tower_filament` (#689).
    - **Profiles (upstream):**
      - `0.20 Standard @Snapmaker U1 (0.4 nozzle).json`
      - `Snapmaker U1 (0.4 nozzle).json`
      - `Generic PETG @U1 0.4 nozzle.json`

      The Snapmaker fork names them `0.20mm Standard @…` and `Generic PETG.json`.
    - **Never mix one app's profiles with the other's binary.** The fork's start G-code uses a fork-only variable.
    - **`lure sync-profiles snapmaker_u1`** fetches the chain for the pinned version and flattens it (same vendor first, then OrcaFilamentLibrary, merged root-first, clean `name`/`*_settings_id`, UTF-8-sig). The flattened files are committed under `spec/printers/snapmaker_u1/profiles/`.
    - **Slice** with STL input (3MF segfaults in the fork, #935):
      ```
      xvfb-run -a orca-slicer --slice 0 --load-settings "machine.json;process.json" --load-filaments filament.json \
        --enable-prime-tower=0 --sparse-infill-density=100% --wall-loops=4 --top-shell-layers=6 \
        --bottom-shell-layers=4 --seam-position=back --ironing-type=no --outputdir fab/print/ head.stl tail.stl
      ```
      The U1 stock process enables the prime tower because it's a 4-tool changer; turn it off. Booleans use the `--key=0` form.
    - **Orientation:** on the side, split plane on the bed. The cavity is an inner shell of the same mesh.
    - **Pause:** insert `M600` (or the reference file's pause) at the first layer at or above the cavity-ceiling Z from `report.json`.
    - **Verify:** parse time, grams and layers. Diff the CONFIG block, start/end macros (`PRINT_START`, …) and thumbnails (48×48 and 300×300 PNG) against the owner's reference file.

    ## Tasks (to be created when this feature starts)
