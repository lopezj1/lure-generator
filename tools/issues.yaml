- key: f3t1
  parent: f3
  title: "[Task] F3: V-joint split, pin bore, hinge eyes and line tie"
  labels: [type:task, area:geometry]
  body: |
    ## Goal
    Split the envelope at `joint.joint_frac` into **head** and **tail** solids with the V-joint:
    - gap `joint.gap_mm`
    - arms at `joint.angle_deg`
    - apex radius ≥ the CNC tool radius when `process.method = "cnc"`

    Add the vertical pin bore just behind the joint, the hinge-eye locations at `joint.hinge_eye_z`, and the line tie at `joint.line_tie_z`. Do the booleans on the full body before splitting where possible, and assert validity after every boolean.
    ## Acceptance
    - [ ] Two valid solids; volumes sum to the envelope minus the gap wedge (analytic check)
    - [ ] Exported as `model/head.*` and `model/tail.*`
    ## Files / modules touched
    `src/luregen/geometry/joint.py`, `src/luregen/families/glide.py` (new family module)

- key: f3t2
  parent: f3
  title: "[Task] F3: inset-loft cavities with a self-supporting roof and a solid keel"
  labels: [type:task, area:geometry]
  body: |
    ## Goal
    Per section, build one sealed air cavity as an **explicit inset loft** through the mid stations only. Never use `offset_3d` or Shell.
    - **Walls:** v_radius/half_width reduced by `wall_thk`, keeping the min-skin rule.
    - **Roof:** a gable (45°) or teardrop cross-section roof, self-supporting when printed on its side.
    - **Keel:** solid below `keel_top_z`; keep cavities ≥ 1 mm from joint, hinge and ballast features.

    Use identical spline parameters across sections (F2 pitfall).
    ## Acceptance
    - [ ] Each print section is 1 solid with 2 shells
    - [ ] The cavity volume responds monotonically to `wall_thk` and `keel_top_z`; these are the solver knobs for F4
    ## Files / modules touched
    `src/luregen/geometry/cavity.py`

