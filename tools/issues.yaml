# Issue manifest for lopezj1/lure-generator.
# `key` is a local id; `parent` refers to a key. The seed script creates issues in file order,
# links each one under its parent with addSubIssue, and records key → number in issues.state.json
# so that re-running it never creates duplicates.

- key: epic
  title: "[Epic] Lure generator v1: glide bait, image → balanced CAD → U1 print / Shapeoko CNC"
  labels: [type:epic]
  body: |
    ## Goal
    A code-first, config-driven pipeline that turns a **profile image + TOML spec** into a **balanced lure CAD model** and then into **G-code** for either:
    - a **Snapmaker U1** printer (OrcaSlicer CLI), or
    - a **Shapeoko 3 XXL** router (Carbide Motion, GRBL 1.1 fork).

    The first family is a two-section jointed **glide bait** for striped bass.

    ## Requirements (glide bait)
    | ID | Requirement | Target |
    |---|---|---|
    | F1 | Level static hang | Fore/aft CG − CB ≤ 1 mm, whole lure with hardware |
    | F2 | Self-righting | CB above CG by ~8% of max body depth |
    | F3 | Sink behavior | float / suspend / slow sink. Default slow sink in salt water (~1.03–1.06 g/cm³ with hardware). |
    | F4 | Section balance | Mass, displacement, CG and CB solved **per section** |
    | F5 | Heavy head, buoyant tail | Head ~1.00–1.05 g/cm³, tail ~0.70–0.80. Head:tail mass ~2.4:1. |
    | F6 | Hardware as point masses | Measured mass and position for each part |
    | F7 | Strength | Through-wire option for wood/CNC. Screw eyes only into solid printed bosses. |
    | F8 | Profile flexibility | Any station table (perch, menhaden, mullet) |
    | F9 | Size scaling | 100–250 mm with ratios held and ballast re-solved |
    | F10 | Water-tight | One sealed void per printed section, none for wood |

    Starting values come from measuring one reference glide bait. Tank tests (F8 feature) recalibrate them.

    ## Feasibility (researched 2026-11-17)
    | Piece | Verdict |
    |---|---|
    | Image → spline profile | Easy. OpenCV contour, EFD or spline smoothing, ArUco or known-length scale. |
    | Pointed station loft + sealed cavity + mass properties | Proven in a build123d 0.13 test on this machine. `offset_3d` segfaults, so cavities are explicit inset lofts. |
    | 2.5D CNC body (flat sides + roundover) | Works if the outline is two splines (dorsal + ventral), not one closed spline |
    | Headless slicing for the U1 | Upstream OrcaSlicer 2.5.1 CLI with the stock `0.20 Standard @Snapmaker U1` profile |
    | CAM for Shapeoko | No maintained pip CAM library, so a small custom one: shapely for 2.5D, a heightmap drop-cutter for 3D, and a template-driven Carbide Motion post |

    ## Key decisions
    1. One uv project with one `lure` CLI (`profile`, `build`, `check`, `fab`, `sync-profiles`, `analyze-gcode`). Python 3.13, build123d 0.13.
    2. `spec/` holds data and `src/luregen/` holds behavior. Config layers as `_common` ← family ← variant ← `--set`.
    3. A profile always becomes a **station table** (x, center_z, v_radius, half_width). Images and presets share that path.
    4. **The weight target drives scale.** Set `length_mm` *or* `target_weight_oz`, and L scales with m^(1/3).
    5. One outer shape and one set of balance targets. Internals and DFM rules depend on `process` (print/cnc) and `body_style` (loft3d/profile25d).
    6. Hardware masses are **[min, max] ranges**. The build fails if either end breaks the sink mode or level hang, and a trim pocket absorbs the band.
    7. Every build is reproducible: `builds/<family>/<variant>/<ts>-<sha>/` with `resolved.toml` and `report.json`.

    ## Roadmap
    The features below are sub-issues, in order. F6 and F7 can run in parallel once F5 is done.

    ## Risks
    - Slicer CLI regressions: pin the binary version and keep the Snapmaker Orca fork as a fallback.
    - OCCT boolean or fillet failures: assert validity after every op, keep ≥1 mm between features, and run risky ops in a subprocess.
    - Density bands are guesses until tank tests.
    - Wood density varies from blank to blank: weigh each blank and re-solve before machining.

    ## Workflow
    See `CLAUDE.md`. In short: one branch and worktree per feature, one PR per feature, and session logs posted as issue comments.

- key: f0
  parent: epic
  title: "[Feature] F0 Repo scaffold, config system and tooling"
  labels: [type:feature, area:infra]
  body: |
    ## Goal
    A runnable skeleton: uv project, `lure` CLI, a layered config system, the `spec/` data layout, the build output convention, and CI.

    ## Design notes
    **Repo layout:**
    ```
    spec/
      materials.toml                  # densities: plastics, woods, resins, ballast, steel, water, finishes
      hardware/{hooks,split_rings,screw_eyes,pins,wire,ballast}.toml   # measured [min,max] g, by id
      designs/_common.toml
      designs/glide/{family.toml, profiles/, variants/}
      printers/snapmaker_u1/{machine.toml, profiles/, reference/}
      routers/shapeoko3_xxl/{machine.toml, post.toml, tools.toml, feeds.toml, reference/}
    src/luregen/{config,profile,families,geometry,physics,dfm,fab/{printer,router},report}/ cli.py
    tools/  tests/{unit,golden,fixtures}/  builds/ (gitignored)  field/
    ```
    **Config layering:** `_common.toml` ← `family.toml` ← variant (`extends = …`) ← `--set a.b=c`. Validated with pydantic. The resolved result is written to the build folder.

    **Weights are fully parameterized:**
    | What | Where | Change later by |
    |---|---|---|
    | Hardware masses | `spec/hardware/*.toml` [min,max] | Edit the catalog, or override per variant |
    | Material densities | `spec/materials.toml` | Edit, or `--set process.material_density=0.43` |
    | Target weight | variant `[size] target_weight_oz` | Edit or `--set` (length re-solves) |
    | Sink mode, density bands | `_common` → family → variant | Edit or `--set`, recalibrated from `field/` |
    | Ballast mass | solver output | Pin it with `ballast.mass_g` |

    **Core dependencies:** build123d==0.13.0, cadquery-ocp-novtk==8.0.1.1.0, numpy, scipy, opencv-python-headless, scikit-image, pyefd, trimesh, manifold3d, shapely, pydantic>=2, typer. Dev: pytest, ruff, ocp-vscode.

    ## Done when
    - [ ] `uv run lure --help` lists every subcommand (stubs are fine)
    - [ ] A sample glide variant resolves through all layers, and `--set` overrides work
    - [ ] Running `lure build` on the sample creates a build folder with `resolved.toml`
    - [ ] CI runs ruff and pytest green on PRs

