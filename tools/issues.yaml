- key: f8
  parent: epic
  title: "[Feature] F8 Field calibration: tank tests → targets"
  labels: [type:feature, area:field]
  body: |
    ## Goal
    Close the loop: log physical test results and use them to recalibrate the density bands and balance targets.

    ## Design notes
    - `field/tank_tests.csv`: build id, water type and temperature, measured mass, hang angle, sink rate (s per 30 cm), roll recovery, glide width and cadence notes, hardware used.
    - `lure field add` appends a row. `lure field fit` updates the suggested `target_sink` bands and reports the model-vs-measured error.
    - Open questions to answer here:
      - Do the reference ratios hold on a second known-good bait?
      - Which overall density gives the preferred salt-water sink rate?
      - How do joint gap, swing limit and side area map to glide width?
      - Does a menhaden profile stay roll-stable?

    ## Tasks (to be created when this feature starts)
    - [ ] Tank-test protocol doc and CSV schema
    - [ ] `lure field` commands
    - [ ] Calibration report

    ## Done when
    - [ ] Three or more printed builds logged; the density bands are updated from data

