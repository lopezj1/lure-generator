- key: f2
  parent: epic
  title: "[Feature] F2 Envelope geometry and export (loft3d + profile25d)"
  labels: [type:feature, area:geometry]
  body: |
    ## Goal
    Build the outer body from a station table in two styles and export clean files.

    ## Design notes
    - **loft3d:** `Solid.make_loft([Vertex(nose)] + wires + [Vertex(tail)])`. Every wire needs the same edge count and the same start point and direction, or the loft twists. Section shapes are ellipse, egg or teardrop (egg/teardrop for a keeled belly). Tested valid with 23 sections.
    - **profile25d** (the CNC DFM default): the outline is **two splines (dorsal + ventral) joined at nose and tail vertices**, because a single periodic closed spline fails to fillet at any radius. Then `extrude(both=True)` to the max width, then fillet both outer edge loops. Clamp the radius with `max_fillet()` and with the outline's minimum curvature radius.
    - **Export:** STEP; STL at `tolerance≈0.02, angular_tolerance=0.1` (the default 0.001 is huge); 3MF via `Mesher`. Check watertightness with trimesh/manifold3d.
    - **Never call `offset_3d`/Shell on the pointed loft.** It segfaults the process.

    ## Done when
    - [ ] Both styles build for the sample variant; STEP opens cleanly; STL is watertight
    - [ ] Volume and centroid of an ellipsoid-station loft are within 2% of the analytic values

