- key: f6t6
  parent: f6
  title: "[Task] F6c: multi-material support interface for loft3d prints"
  labels: [type:task, area:print]
  body: |
    ## Goal
    Lure sections printed on their side with a fully rounded body (loft3d) have a curved lower flank that needs supports. Use a **dissimilar-material support interface** (PLA↔PETG don't bond) so the underside comes off clean and the clear coat has no support scarring. This follows the owner's reference slice (#26, findings in the #25 comments).
    ## Design notes
    - **Default for `process.method = "print"`, `body_style = "loft3d"`:**
      - body PETG, interface PLA (or the reverse for a PLA body)
      - tree(auto) supports, `support_top_z_distance = 0`, 3 interface layers
      - prime tower on
    - **Filament slots** (`T0`–`T3`: material, color, profile) live in `spec/printers/snapmaker_u1/machine.toml`; the variant selects the body and interface slots.
    - The prime tower override becomes conditional: off for single-filament jobs, on for multi-filament jobs.
    - These are global CLI overrides, so STL input still works: `--enable-support=1 --support-type=tree(auto) --support-interface-filament=<n> --support-top-z-distance=0`.
    - The profile25d body (flat sides) needs no supports.
    - **DFM rule:** loft3d on its side needs supports. Warn when the interface filament is missing or the same material as the body.
    ## Acceptance
    - [ ] The sample loft3d variant slices with a PETG body and PLA interface (container runtime OK)
    - [ ] The G-code shows the expected tool changes and the prime tower
    - [ ] Single-filament jobs still slice without the prime tower
    - [ ] Report: interface grams, number of tool changes, time
    ## Depends on
    {{f3}}, {{f6t2}}

