- key: f1
  parent: epic
  title: "[Feature] F1 Profile extraction: image → station table"
  labels: [type:feature, area:profile]
  body: |
    ## Goal
    Turn a side-profile photo (plus an optional top view) into a clean, scaled **station table** (`x, center_z, v_radius, half_width`), with a debug overlay for visual approval.

    ## Design notes
    - **Segmentation:** grayscale, Otsu threshold, morphological open/close, largest external contour (`CHAIN_APPROX_NONE`). rembg is optional for messy backgrounds.
    - **Scale:** an ArUco marker (OpenCV `ArucoDetector`) gives a homography that corrects tilt and gives mm/px. The fallback is `total_length_mm` from config.
    - **Smoothing:** elliptic Fourier descriptors (pyefd, ~15–25 harmonics) or `splprep(per=1)`, then an arc-length resample.
    - **Rails:** split at the nose and tail (x extremes) into dorsal z_top(x) and ventral z_bot(x). Then center_z = (top+bot)/2 and v_radius = (top−bot)/2.
    - **Width:** from a top-view image processed the same way, or a config rule (`half_width = k(x)·v_radius`, default ratio 0.34 of depth).
    - **Stations:** ~23, clustered toward the nose and tail. Tips are closed by vertices, not by near-zero sections.
    - Presets (menhaden, mullet) are just station CSVs under `spec/designs/<family>/profiles/presets/`.

    ## Done when
    - [ ] `lure profile <image> -o stations.csv` produces a table and `profile_debug.png`
    - [ ] On a synthetic ellipse image, recovered dimensions are within 1%
    - [ ] The owner approves the overlay for the first real photo

