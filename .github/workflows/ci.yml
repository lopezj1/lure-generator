name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # Debug overlays from the profile tests (#14), uploaded below for visual review.
      LUREGEN_TEST_ARTIFACTS: artifacts
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the OCP (build123d) wheel
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libx11-6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group web
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: OpenAPI schema is up to date
        run: |
          uv run lure serve --dump-openapi web/openapi.json
          git diff --exit-code web/openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: artifacts/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - name: API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api.d.ts
