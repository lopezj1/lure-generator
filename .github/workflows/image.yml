name: Image

# Builds the deploy image (docker/Dockerfile, #69), runs the integration tests inside it (real
# OrcaSlicer slice, profile sync from GitHub) and smoke-tests the served app.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the test target (runtime + dev deps + tests/)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: luregen:test
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          load: true
          tags: luregen:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
      - name: Image size
        run: docker image ls luregen
      - name: Integration tests inside the image
        run: docker run --rm luregen:test pytest -m integration -q
      - name: Smoke test (/api/health and the SPA)
        run: |
          mkdir -p data/spec data/builds data/uploads
          cp -r spec/. data/spec/
          docker run -d --name luregen -p 8000:8000 --user "$(id -u):$(id -g)" \
            -v "$PWD/data/spec:/data/spec" -v "$PWD/data/builds:/data/builds" \
            -v "$PWD/data/uploads:/data/uploads" luregen:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/ | grep -qi '<div id="app"'
          docker exec luregen lure build spec/designs/glide/variants/striper_175_petg.toml
          ls -ln data/builds/glide/*/
      - name: Container logs
        if: always()
        run: docker logs luregen || true
