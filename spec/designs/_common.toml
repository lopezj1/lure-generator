# Defaults inherited by every lure family.

[buoyancy]
water = "salt"
target_sink = "slow_sink"
# Overall density bands (g/cm³, with hardware). Starting values; recalibrate from field/ (F8).
sink_bands = { float = [0.90, 0.98], suspend = [1.020, 1.030], slow_sink = [1.03, 1.06] }

[ballast]
material = "tungsten"

[dfm.print]
min_wall_mm = 1.6
cavity_roof = "gable45"
min_skin_to_cavity_mm = 1.2

[dfm.cnc]
tools = ["flat_6.35", "flat_3.175", "ball_3.175"]
min_wood_wall_mm = 3.5
max_pocket_depth_x_dia = 3.0
roundover_r_mm = 4.0

[report]
show_oz = true
