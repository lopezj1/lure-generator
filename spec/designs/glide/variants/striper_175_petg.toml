# First buildable glide: 175 mm PETG print, slow sink in salt water.
extends = "../family.toml"
name = "striper_175_petg"

[size]
length_mm = 175
# target_weight_oz = 2.0   # alternative: solve length from weight (set one, not both)

[process]
method = "print"
body_style = "loft3d"
material = "PETG"
rigging = "screw_eye"

