# First buildable glide: 175 mm PETG print, slow sink in salt water.
extends = "../family.toml"
name = "striper_175_petg"

[size]
length_mm = 175
# target_weight_oz = 2.0   # alternative: solve length from weight (set one, not both)

[process]
method = "print"
body_style = "loft3d"
material = "PETG"
rigging = "screw_eye"

# Positions: joint hardware sits where F3 places it (report.json geometry.joint: line tie,
# hinge eyes, pin); belly/tail positions are still placeholders. Masses: spec/hardware.
[[hardware]]
id = "screw_eye_210"
name = "Line tie"
section = "head"
x_mm = 1
z_mm = -4

[[hardware]]
id = "screw_eye_210"
name = "Belly hanger eye"
section = "head"
x_mm = 55
z_mm = -22

[[hardware]]
id = "treble_2"
name = "Belly treble"
section = "head"
x_mm = 55
z_mm = -30

[[hardware]]
id = "split_ring_4"
name = "Belly split ring"
section = "head"
x_mm = 55
z_mm = -25

[[hardware]]
id = "screw_eye_210"
name = "Hinge eye (head, lower)"
section = "head"
x_mm = 89
z_mm = -12

[[hardware]]
id = "screw_eye_210"
name = "Hinge eye (head, upper)"
section = "head"
x_mm = 89
z_mm = 6

[[hardware]]
id = "hinge_pin_1p6x30"
name = "Hinge pin"
section = "tail"
x_mm = 92
z_mm = -3

[[hardware]]
id = "screw_eye_210"
name = "Tail hanger eye"
section = "tail"
x_mm = 160
z_mm = -8

[[hardware]]
id = "treble_2"
name = "Tail treble"
section = "tail"
x_mm = 165
z_mm = -14

[[hardware]]
id = "split_ring_4"
name = "Tail split ring"
section = "tail"
x_mm = 162
z_mm = -10

# Print fab (#51): PETG body on T1 with a PLA support interface on T0 (machine.toml slots).
[print]
body_slot = 1
interface_slot = 0
