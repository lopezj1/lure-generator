# Shapeoko 3 XXL on Carbide Motion. Values marked unverified still wait on the owner.
name = "Shapeoko 3 XXL"
homing_corner = "back_right"  # GRBL machine coordinates are negative from home
safe_z_machine = -5.0          # G53 Z for retracts and tool changes
rapid_mm_min = [5000.0, 5000.0, 2500.0]  # runtime estimate only
rapid_verified = false
tool_change_s = 60.0           # runtime estimate per M6 (prompt, swap, probe)
bitsetter = true               # confirmed by the owner

[controller]
kind = "carbide_motion"
firmware = "grbl_1.1_carbide"
# Everything else is rejected or ignored by Carbide Motion. G53 is accepted as the
# machine-coordinate modifier that Carbide Create itself emits.
supported = ["G0", "G1", "G2", "G3", "G4", "G17", "G18", "G19", "G20", "G21", "G28",
             "G53", "G90", "G91", "M0", "M1", "M2", "M3", "M5", "M6", "M30"]

[travel]
x = 838.0
y = 838.0
z = 95.0
verified = false  # Z depends on the Z axis (belt vs HDZ) and spoilboard

[spindle]
kind = "unknown"  # router model unknown
min_rpm = 10000
max_rpm = 30000
# rpm at dial settings 1, 2, ...: unknown until the owner reads the router's dial.
dial_rpm = []
verified = false
