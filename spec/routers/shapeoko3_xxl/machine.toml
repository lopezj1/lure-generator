# Shapeoko 3 XXL on Carbide Motion. Values marked unverified still wait on the owner.
name = "Shapeoko 3 XXL"
homing_corner = "back_right"  # GRBL machine coordinates are negative from home
safe_z_machine = -5.0          # G53 Z for retracts and tool changes
# GRBL $110-$112 (owner's controller, 2026-11-19). GRBL also caps every feed move so no axis
# exceeds its max rate, so these bound cutting moves too (the Z cap slows steep 3D moves).
rapid_mm_min = [15000.0, 15000.0, 1300.0]
rapid_verified = true
accel_mm_s2 = [1000.0, 1000.0, 100.0]  # GRBL $120-$122; not used by the estimates yet
tool_change_s = 60.0           # runtime estimate per M6 (prompt, swap, probe)
bitsetter = true               # confirmed by the owner

[controller]
kind = "carbide_motion"
firmware = "grbl_1.1_carbide"
# Everything else is rejected or ignored by Carbide Motion. G94 appears in a reference file
# that ran on this machine. G53 is accepted as the
# machine-coordinate modifier that Carbide Create itself emits.
supported = ["G0", "G1", "G2", "G3", "G4", "G17", "G18", "G19", "G20", "G21", "G28",
             "G53", "G90", "G91", "G94", "M0", "M1", "M2", "M3", "M5", "M6", "M30"]

[travel]
# GRBL $130-$132 soft-limit travel. Usable Z depends on the spoilboard and stock.
x = 845.0
y = 850.0
z = 150.0
verified = true

[workholding]
# Owner's setup (#28, 2026-11-21). The flip-pin holes and the cut-out go into the spoilboard.
spoilboard_mm = 12.7          # 1/2in
work_area_mm = [762.0, 762.0] # 30in × 30in usable envelope
clamps = "small-footprint clamps on the blank's edges"
min_margin_mm = 6.35          # at least 1/4in of waste all around

[spindle]
# Hand-set router: GRBL has $30=1000 and laser mode $32=1, so the G-code S word has no
# effect on the machine. Speed comes only from the dial; the post prints the dial setting.
kind = "dewalt_611"
min_rpm = 16500
max_rpm = 27000
dial_rpm = [16500, 18000, 19800, 21500, 24200, 27000]  # dial 1-6, Carbide 3D chart
verified = true
