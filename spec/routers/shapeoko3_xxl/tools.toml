# Starter tool library. Keys match `dfm.cnc.tools` in spec/designs/_common.toml.
# `number` is the M6 T<n> the post emits; Carbide Motion uses it in its tool-change prompt.
# 102 (1/8in flat, listed as 3.17 mm) is confirmed by the owner's Carbide Create sample.
# The others follow the same catalog numbering but are UNVERIFIED placeholders.

[tools."flat_6.35"]
name = "1/4in flat end mill"
number = 201
shape = "flat"
diameter = 6.35
flutes = 2
number_verified = false

[tools."flat_3.175"]
name = "1/8in flat end mill"
number = 102
shape = "flat"
diameter = 3.175
flutes = 2
number_verified = true

[tools."ball_3.175"]
name = "1/8in ball end mill"
number = 101
shape = "ball"
diameter = 3.175
flutes = 2
number_verified = false

[tools."flat_0.794"]
name = "1/32in flat end mill"
number = 5          # T5 in the owner's Fusion finishing job; unverified for Carbide Motion
shape = "flat"
diameter = 0.794
flutes = 2
number_verified = false
# Reach for 3D finishing: the shank can't go below the flutes' length into a deep wall.
# Typical 1/32in stub tools: 1/8in shank, ~2.4 mm (3/32in) flutes. Unverified (#28).
flute_length = 2.4
shank_diameter = 3.175
