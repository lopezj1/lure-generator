# Tool library. Keys match `dfm.cnc.tools` in spec/designs/_common.toml.
# `number` is the M6 T<n> the post emits; Carbide Motion uses it in its tool-change prompt.
# Numbers and geometry follow the owner's Fusion 360 tool library (#28, 2026-11-21).
# Lengths in mm: `flute_length` is the cutting length (LCF), `shank_diameter` the shank.

[tools."flat_6.35"]
name = "1/4in flat end mill"
number = 2
shape = "flat"
diameter = 6.35
flutes = 2
number_verified = true
flute_length = 19.05      # 0.75in
shank_diameter = 6.35

[tools."flat_3.175"]
name = "1/8in flat end mill"
number = 1
shape = "flat"
diameter = 3.175
flutes = 2
number_verified = true
flute_length = 12.7       # 0.5in
shank_diameter = 3.175

[tools."ball_3.175"]
name = "1/8in ball end mill"
number = 3
shape = "ball"
diameter = 3.175
flutes = 2
number_verified = true
flute_length = 22.1       # 0.87in
shank_diameter = 3.175

[tools."flat_0.794"]
name = "1/32in flat end mill"
number = 5
shape = "flat"
diameter = 0.794
flutes = 2
number_verified = true
# Reach for 3D finishing: the 1/8in shank can't go below the flutes into a deep wall.
flute_length = 1.5875     # 0.0625in
shank_diameter = 3.175

[tools."taperball_2"]
name = "R1.0 tapered ball end mill"
number = 13
shape = "ball"
diameter = 2.0      # tip: 1.0 mm radius
taper_deg = 3.92    # cone half-angle; flutes widen to the 1/4in shank at the top
flutes = 2
number_verified = true
flute_length = 31.75      # 1-1/4in
shank_diameter = 6.35
